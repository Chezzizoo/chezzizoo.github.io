<!DOCTYPE html>
<meta charset="utf-8">
<title>Redirecting...</title>
<link rel="canonical" href="https://xprime.today/">

<style>
  /* Full-screen dark overlay */
  #warning-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  /* Big centered box */
  #warning-box {
    background: #ffffff;
    max-width: 500px;
    width: 90%;
    padding: 24px 20px;
    border-radius: 8px;
    text-align: center;
    font-family: sans-serif;
  }

  #warning-box h1 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 24px;
  }

  #warning-box p {
    margin: 0 0 20px;
    font-size: 16px;
  }

  #warning-ok {
    padding: 10px 20px;
    border: none;
    background: #007bff;
    color: #fff;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
  }

  #warning-ok:hover {
    background: #0062cc;
  }
</style>

<div id="warning-overlay">
  <div id="warning-box">
    <h1>Before you continue</h1>
    <p>Please turn off ads in settings after continuing.</p>
    <button id="warning-ok">OK</button>
  </div>
</div>

<script>
  document.getElementById('warning-ok').addEventListener('click', function () {
    // hide overlay
    document.getElementById('warning-overlay').style.display = 'none';
    // redirect
    window.location.replace('https://xprime.today/');
  });
</script>
