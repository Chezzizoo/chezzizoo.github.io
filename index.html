<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <link rel="canonical" href="https://xprime.today/">
  <!-- Important for proper mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Full-screen dark overlay */
    #warning-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    /* Big centered box */
    #warning-box {
      background: #ffffff;
      width: 90vw;          /* use viewport units for mobile */
      max-width: 480px;
      padding: 24px 20px;
      border-radius: 12px;
      text-align: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #warning-box h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 7vw;       /* scales on mobile, ~24–30px */
    }

    #warning-box p {
      margin: 0 0 20px;
      font-size: 4.5vw;     /* scales on mobile */
      line-height: 1.4;
    }

    #warning-ok {
      padding: 12px 24px;
      border: none;
      background: #007bff;
      color: #fff;
      font-size: 4.5vw;     /* big button text on phone */
      border-radius: 999px;
      cursor: pointer;
      min-width: 50%;
    }

    #warning-ok:active {
      transform: scale(0.98);
    }

    /* Optional: slightly smaller text on big desktop screens */
    @media (min-width: 768px) {
      #warning-box h1 {
        font-size: 28px;
      }
      #warning-box p,
      #warning-ok {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="warning-overlay">
    <div id="warning-box">
      <h1>Before you continue</h1>
      <p>Please turn off ads in settings before continuing.</p>
      <button id="warning-ok">OK</button>
    </div>
  </div>

  <script>
    document.getElementById('warning-ok').addEventListener('click', function () {
      // hide overlay
      document.getElementById('warning-overlay').style.display = 'none';
      // redirect
      window.location.replace('https://xprime.today/');
    });
  </script>
</body>
</html>
